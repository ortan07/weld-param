<style>

:root[data-theme="light"]{--bg:#eef1f7;--bg2:#e3e8f1;--card:#fff;--tile:#f4f6fb;--line:#d3dae8;--text:#141b2b;--muted:#64718a;--rh:#0891b2;--lh:#c026d3;--v:#d97706;--s:#059669}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--text);font-family:"Sarabun",system-ui,sans-serif;padding:14px;
background:radial-gradient(900px 400px at 85% -10%,var(--glow),transparent 60%),var(--bg)}
.hero{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:14px}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:.72rem;color:var(--spark);letter-spacing:.18em}
h1{margin:2px 0 0;font:700 1.9rem/1.05 "Rajdhani",sans-serif;letter-spacing:.04em;text-transform:uppercase}

.week{font:700 1.1rem "JetBrains Mono",monospace;padding:8px 14px;border:1px solid var(--spark);border-radius:8px;color:var(--spark2);background:var(--glow)}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}

.lbl{font:600 .7rem "JetBrains Mono",monospace;color:var(--muted);letter-spacing:.15em;margin:10px 0 2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 16px}
input.i,button.b{font:inherit;font-size:.9rem;border-radius:8px;border:1px solid var(--line);padding:8px 12px;background:var(--card);color:var(--text)}
button.b{cursor:pointer;font-weight:600}
button.b.p{background:linear-gradient(135deg,var(--spark),var(--spark2));border:0;color:#1a0c00}
.st{font:600 .78rem "JetBrains Mono",monospace;color:var(--s)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:18px;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:linear-gradient(90deg,var(--glow),transparent);border-bottom:1px solid var(--line)}
.ph h2{margin:0;font:700 1.5rem "Rajdhani",sans-serif;letter-spacing:.08em}
.ph span{font:600 .72rem "JetBrains Mono",monospace;color:var(--muted)}

.gt{display:flex;align-items:center;gap:10px;font:700 .8rem "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--spark2);margin-bottom:10px}
.gt:after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding-bottom:10px}
.tile{background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:10px;border-top:3px solid var(--c)}
.tile.RH{--c:var(--rh)}.tile.LH{--c:var(--lh)}

.th{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.gn{font:700 1.15rem "Rajdhani",sans-serif;letter-spacing:.06em}
.sd{font:700 .68rem "JetBrains Mono",monospace;color:#06141a;background:var(--c);padding:2px 7px;border-radius:5px}
.f{margin-top:6px}
.fl{display:flex;justify-content:space-between;font:600 .65rem "JetBrains Mono",monospace;color:var(--muted);letter-spacing:.1em}
.fl em{font-style:normal;color:var(--chg)}
.f input{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--fc);font:700 1.45rem "JetBrains Mono",monospace;padding:2px 0;outline:0}
.f input:focus{border-bottom-color:var(--spark)}
.f.v{--fc:var(--v)}.f.s{--fc:var(--s)}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fc);border-radius:2px}
.note{font-size:.78rem;color:var(--muted);margin-top:4px}
.crumb{display:flex;align-items:center;gap:8px;font:600 .8rem "JetBrains Mono",monospace;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.crumb a{color:var(--spark2);cursor:pointer;text-decoration:underline}
.yr{display:flex;align-items:center;gap:10px}.yr button{width:36px;height:36px;padding:0}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mc,.wc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;color:var(--text);font:inherit;position:relative;overflow:hidden}
.mc:hover,.wc:hover{border-color:var(--spark)}
.mc.now,.wc.now{box-shadow:0 0 0 1px var(--spark),0 0 18px var(--glow)}
.mn{font:700 .7rem "JetBrains Mono",monospace;color:var(--spark);letter-spacing:.15em}
.mt{font:700 1.5rem "Rajdhani",sans-serif;margin:2px 0 8px}
.pg{height:5px;background:var(--line);border-radius:3px;overflow:hidden}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--spark),var(--spark2))}
.sub{font-size:.78rem;color:var(--muted);margin-top:6px}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.wc .wt{font:700 1.6rem "Rajdhani",sans-serif}
.badge{display:inline-block;font:700 .68rem "JetBrains Mono",monospace;padding:3px 8px;border-radius:5px;margin-top:4px}
.badge.ok{background:rgba(52,211,153,.18);color:var(--s)}.badge.no{background:var(--tile);color:var(--muted)}
.sv{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.sv label{display:block;font:600 .7rem "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
.sv input{min-width:220px;border-color:var(--spark)}
.sv button:disabled{opacity:.35;cursor:not-allowed}
.warn{color:var(--chg);font-size:.8rem}

.hero,#app{max-width:1120px;margin-left:auto;margin-right:auto}
body{padding:20px 16px 40px}
.mg{grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.mg{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.mg{grid-template-columns:repeat(2,1fr);gap:10px}}
.mc{padding:18px 16px;min-height:118px;border-radius:16px;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s}
.mc:hover{transform:translateY(-2px)}
.mc .mt{margin:0;font-size:1.35rem}
.mh{display:flex;justify-content:space-between;align-items:center}
.sd2{width:9px;height:9px;border-radius:50%;display:block}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:auto}
.segs i{height:6px;border-radius:3px;background:var(--line)}.segs i.on{background:var(--spark)}
.sec{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin:30px 0 12px}
.sec h3{margin:0;font:700 1.25rem "Rajdhani",sans-serif;letter-spacing:.08em}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted)}
.lg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.cc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.cch{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.cch h4{margin:0;font:700 1.2rem "Rajdhani",sans-serif;letter-spacing:.08em}
.stt{font:700 .7rem "JetBrains Mono",monospace;padding:4px 9px;border-radius:999px;border:1px solid var(--c);color:var(--c)}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;border-bottom:1px solid var(--line)}
.bc{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:112px;background:none;border:0;cursor:pointer;padding:0;color:var(--muted);font:600 .65rem "JetBrains Mono",monospace}
.bc i{display:block;width:70%;max-width:22px;border-radius:4px 4px 0 0}
.bc:hover i{filter:brightness(1.2)}
.bls{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:5px;font:600 .62rem "JetBrains Mono",monospace;color:var(--muted);text-align:center}
@media(max-width:420px){.cg{grid-template-columns:1fr}}
.tile.cur{background:color-mix(in srgb,var(--v) 13%,var(--tile))}
.tile.pwr{background:color-mix(in srgb,var(--s) 13%,var(--tile))}
.tile.pwr .f.v{--fc:var(--s)}

:root{--nv:#ffd60a;--ns:#00f5a0}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--nv:#d98e00;--ns:#059669}}
:root[data-theme="light"]{--nv:#d98e00;--ns:#059669}
.cc{background:linear-gradient(160deg,var(--card),color-mix(in srgb,var(--spark) 6%,var(--card)));box-shadow:0 0 24px -12px var(--spark)}
@keyframes dash{to{stroke-dashoffset:-136}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pulse{0%{transform:scale(1);opacity:.85}100%{transform:scale(3.4);opacity:0}}
@keyframes blink{50%{opacity:.35}}
.ln{stroke-dasharray:1;animation:draw 1.3s ease-out both}
.run{stroke-dasharray:6 62;animation:dash 2.4s linear infinite;stroke:#fff;stroke-width:2.6;stroke-linecap:round;fill:none;opacity:.9}
.zl{stroke-dasharray:3 4;animation:dash 6s linear infinite}
.pu{transform-box:fill-box;transform-origin:center;animation:pulse 1.7s ease-out infinite}
.bk{animation:blink 1.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.run,.pu,.zl,.ln,.bk{animation:none}.run,.pu{display:none}}

.hero{position:relative;overflow:hidden;padding:22px 24px 26px;border:1px solid color-mix(in srgb,var(--spark) 45%,var(--line));border-radius:20px;margin-bottom:20px;align-items:center;
background:linear-gradient(120deg,var(--card),color-mix(in srgb,var(--spark) 9%,var(--card)) 60%,color-mix(in srgb,#1d6fe0 12%,var(--card)));box-shadow:0 10px 40px -18px var(--spark)}
.hero:after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,transparent,var(--spark),#fff,var(--spark2),transparent) no-repeat;background-size:35% 100%;animation:runbar 2.6s linear infinite}
.hl{position:relative;z-index:2;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.week{position:relative;z-index:2}
.ht h1{font-size:2rem;margin:4px 0 2px}
.ht h1 b{background:linear-gradient(100deg,var(--spark) 20%,#fff 50%,var(--spark2) 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3.2s linear infinite}
.sb{font:700 .85rem "JetBrains Mono",monospace;letter-spacing:.42em;color:var(--muted)}
.logo{background:#fff;border-radius:14px;padding:10px 20px;box-shadow:0 0 0 1px rgba(29,111,224,.25),0 0 26px rgba(56,189,248,.45);animation:glow 2.6s ease-in-out infinite}
.logo span{display:block;font:800 2.3rem/1 "Rajdhani",sans-serif;font-style:italic;letter-spacing:.12em;
background:linear-gradient(100deg,#0b4fb3 0 35%,#38bdf8 50%,#0b4fb3 65% 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3.4s linear infinite}
.orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.45;z-index:0}
.o1{width:220px;height:220px;background:var(--spark);right:8%;top:-90px;animation:drift 9s ease-in-out infinite}
.o2{width:200px;height:200px;background:#1d6fe0;left:30%;bottom:-120px;animation:drift 11s ease-in-out infinite reverse}
.sp{position:absolute;bottom:4px;width:3px;height:3px;border-radius:50%;background:var(--spark2);box-shadow:0 0 6px 2px var(--spark);opacity:0;z-index:1;animation:spark 3.2s linear infinite}
@keyframes runbar{from{background-position:-40% 0}to{background-position:140% 0}}
@keyframes shine{from{background-position:0 0}to{background-position:-260% 0}}
@keyframes glow{50%{box-shadow:0 0 0 1px rgba(29,111,224,.4),0 0 40px rgba(56,189,248,.8)}}
@keyframes drift{50%{transform:translate(40px,18px) scale(1.15)}}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-95px) scale(.3);opacity:0}}
@media(prefers-reduced-motion:reduce){.hero:after,.ht h1 b,.logo,.logo span,.orb,.sp{animation:none}.sp{display:none}}
@media(max-width:560px){.ht h1{font-size:1.45rem}.logo span{font-size:1.8rem}}

:root{color-scheme:dark;--bg:#060918;--bg2:#0b1024;--card:#0e1531;--tile:#141d42;--line:#26336a;--text:#e9eeff;--muted:#8895c7;
--spark:#7c5cff;--spark2:#38bdf8;--rh:#22d3ee;--lh:#c084fc;--v:#4f9dff;--s:#2bf5a0;--warn:#fbbf24;--chg:#ff4d8d;--glow:rgba(124,92,255,.24);--nv:#4f9dff;--ns:#2bf5a0}
body{background:radial-gradient(900px 520px at 85% -10%,var(--glow),transparent 60%),radial-gradient(800px 520px at -5% 105%,rgba(43,245,160,.09),transparent 60%),radial-gradient(700px 400px at 20% 0%,rgba(56,189,248,.08),transparent 60%),var(--bg)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(124,92,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(124,92,255,.07) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 80%);mask-image:radial-gradient(ellipse at 50% 0,#000,transparent 80%)}

.mc:hover{box-shadow:0 0 26px -8px var(--spark);border-color:var(--spark2)}

:root{--v:#ffd60a;--nv:#ffd60a;--warn:#ff8a3d}
.gt{margin-bottom:12px}

  const Ps=l.g.map((_,gi)=>panel(l,gi,WK)),tl=Ps.reduce((a,x)=>a+x.last,0),ta=Ps.reduce((a,x)=>a+x.tot,0),[c]=stc(tl),t=tl?'เบี่ยงจาก Master '+tl+' ค่า':'ตรง Master ทุกค่า',Lw=WK.find(x=>x.k===SW)||WK[WK.length-1];
  return `<div class="cc"><div class="cch"><h4>${l.id}</h4><span style="display:flex;gap:8px;flex-wrap:wrap">${ta?`<span class="stt bk" style="--c:var(--chg)">🚨 ALARM ${ta}</span>`:''}<span class="stt" style="--c:${c}">${TS[Lw.m-1]} W${Lw.w} · ${t}</span></span></div><div class="dual">${Ps.map(x=>x.h).join('')}</div></div>`}
function render(){
  if(V.w||V.std)return editor();
  if(V.m)return month();
  wk.textContent=V.y;
  const R=stab(V.y);
  let mx=1;L.forEach(l=>R[l.id].forEach(r=>mx=Math.max(mx,r.n)));
  const worst=i=>{let w=-1;L.forEach(l=>{const r=R[l.id][i];if(r.w)w=Math.max(w,r.n)});return w};
  const months=TH.map((n,i)=>{const m=i+1,c=[1,2,3,4].filter(w=>S.weeks[key(V.y,m,w)]).length,w=worst(i);
    const dot=w<0?'var(--line)':stc(w)[0];
    return `<button class="mc${V.y===NY&&m===NM?' now':''}" data-m="${m}"><div class="mh"><span class="mn">${String(m).padStart(2,'0')}</span><i class="sd2" style="background:${dot}"></i></div><div class="mt">${n}</div><div class="segs">${[1,2,3,4].map(x=>`<i class="${x<=c?'on':''}"></i>`).join('')}</div><div class="sub" style="margin:0">บันทึกแล้ว ${c}/4 สัปดาห์</div></button>`}).join('');
  const charts=L.map(l=>chart(l)).join('');
  const rk=Object.keys(S.weeks).filter(k=>k.startsWith(V.y+'-')&&(!CM||+k.split('-')[1]===CM)).sort();if(!rk.includes(SW))SW=rk[rk.length-1]||'';
  const yrs=[...new Set([NY-1,NY,NY+1,V.y,...Object.keys(S.weeks).map(k=>+k.split('-')[0])])].sort();
  const ctl=`<div class="cmbar"><div class="cmh"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="currentColor"/></svg><b>เลือกช่วงเวลาดูกราฟ</b><select id="cy">${yrs.map(y=>`<option value="${y}"${y===V.y?' selected':''}>ปี ${y}</option>`).join('')}</select><span class="cmr">▶ ${CM?TH[CM-1]+' ':'ทั้งปี '}${V.y}</span></div><div class="row">${['ทั้งปี',...TH].map((n,i)=>`<button class="chip cm${i===CM?' on':''}" data-cm="${i}">${i?TS[i-1]:n}</button>`).join('')}</div><div class="row" style="margin-top:10px;align-items:center"><span class="st" style="color:var(--spark2)">แสดงค่า</span>${[['all','รวมทุก Gun'],['cur','เฉพาะ CURR (KA)'],['pwr','เฉพาะ POWER (KW)']].map(([k,n])=>`<button class="chip cm${k===MODE?' on':''}" data-md="${k}">${n}</button>`).join('')}</div><div class="row" style="margin-top:10px;align-items:center"><span class="st" style="color:var(--spark2)">สัปดาห์ที่ดู</span>${rk.length?rk.map(k=>{const q=k.split('-');return `<button class="chip cm${k===SW?' on':''}" data-sk="${k}">${TS[+q[1]-1]} W${q[2]}</button>`}).join(''):'<span class="note">ยังไม่มีข้อมูลที่บันทึก</span>'}</div></div>`;
  app.innerHTML=`<div class="tools yr"><button class="b" id="py">‹</button><span class="gn" style="font-size:1.5rem">ปี ${V.y}</span><button class="b" id="ny">›</button><span class="note">เลือกเดือนเพื่อกรอกข้อมูลรายสัปดาห์</span></div>
  <button class="stdc" id="stdb"><i class="sp" style="left:30%;--dx:14px;animation-delay:0s;animation-duration:3s"></i><i class="sp" style="left:48%;--dx:-12px;animation-delay:1s;animation-duration:2.7s"></i><i class="sp" style="left:63%;--dx:18px;animation-delay:0.5s;animation-duration:3.3s"></i><i class="sp" style="left:78%;--dx:-16px;animation-delay:1.6s;animation-duration:2.9s"></i><i class="sp" style="left:90%;--dx:10px;animation-delay:0.9s;animation-duration:3.1s"></i><div class="art"><svg viewBox="0 0 120 100" width="100%" height="100%" aria-hidden="true"><defs><radialGradient id="arcg"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#8be9ff"/><stop offset=".6" stop-color="#7c5cff" stop-opacity=".55"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient></defs>
<rect x="8" y="86" width="42" height="8" rx="3" fill="#26336a"/><rect x="20" y="76" width="18" height="10" rx="2" fill="#3b4a8a"/>
<polyline points="29,76 29,46 72,30" fill="none" stroke="#6d7dff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="72,30 90,58" fill="none" stroke="#d6dcff" stroke-width="5" stroke-linecap="round"/>
<circle cx="29" cy="76" r="5" fill="#0e1531" stroke="#38bdf8" stroke-width="2"/><circle cx="29" cy="46" r="5" fill="#0e1531" stroke="#38bdf8" stroke-width="2"/><circle cx="72" cy="30" r="5" fill="#0e1531" stroke="#38bdf8" stroke-width="2"/>
<rect x="66" y="72" width="50" height="7" rx="3" fill="#3a4580"/><line class="flick" x1="76" y1="71" x2="108" y2="71" stroke="#fff" stroke-width="2"/>
<circle class="arcp" cx="92" cy="64" r="15" fill="url(#arcg)"/><line class="spk" x1="92" y1="64" x2="98" y2="55" style="--tx:10px;--ty:-14px;animation-delay:0.00s"/><line class="spk" x1="92" y1="64" x2="100" y2="60" style="--tx:16px;--ty:-8px;animation-delay:0.09s"/><line class="spk" x1="92" y1="64" x2="96" y2="52" style="--tx:4px;--ty:-18px;animation-delay:0.18s"/><line class="spk" x1="92" y1="64" x2="88" y2="54" style="--tx:-10px;--ty:-14px;animation-delay:0.27s"/><line class="spk" x1="92" y1="64" x2="86" y2="60" style="--tx:-16px;--ty:-6px;animation-delay:0.36s"/><line class="spk" x1="92" y1="64" x2="101" y2="67" style="--tx:18px;--ty:2px;animation-delay:0.45s"/><line class="spk" x1="92" y1="64" x2="84" y2="66" style="--tx:-18px;--ty:3px;animation-delay:0.54s"/></svg></div><div class="stx"><div class="mn"><span class="bk">●</span> MASTER DATA · REFERENCE</div><div class="stt2">Standard <b>Master</b> Welding</div><div class="sub">ลงค่า Standard (ค่ากลาง) ของแต่ละ Line และหัว A / B · แสดงเป็นเส้นอ้างอิงในกราฟ</div><div class="go">กดเพื่อลงข้อมูล ›</div></div><div class="stb ${S.std?'ok':''}">${S.std?'✓ บันทึกแล้ว · '+S.std.name.replace(/</g,'&lt;')+' · '+fmtD(S.std.at):'ยังไม่ได้ตั้งค่า · ใช้ค่าเริ่มต้น'}</div></button>
  <div class="mg">${months}</div>
  <div class="sec"><h3>ความนิ่งของค่า · ทุก Line · ${CM?TH[CM-1]+' ':''}${V.y}</h3><div class="lg"><span><b style="background:var(--nv)"></b>CURR (KA)</span><span><b style="background:var(--ns)"></b>POWER (KW)</span><span><b style="background:var(--s)"></b>ป้ายสถานะ: นิ่ง</span><span><b style="background:var(--warn)"></b>ปรับเล็กน้อย</span><span><b style="background:var(--chg)"></b>ปรับมาก</span></div></div>
  ${ctl}
  <div class="note" style="margin-bottom:12px">กราฟแสดง <b>สถานะของแต่ละ Gun เทียบกับ Master</b> ในสัปดาห์ที่เลือก · เส้นขาวกลางกราฟ = ค่า Master ของ Gun นั้น · เส้นวิ่งขึ้น ▲ (จุดชมพู) = สูงกว่า Master · เส้นวิ่งลง ▼ (จุดฟ้า) = ต่ำกว่า Master · จุดเขียว OK = ตรง Master · ใต้แท่งแสดงค่าที่ลง (ตัวใหญ่) และค่า Master (M) · กล่อง ALARM แสดงการปรับค่าเทียบสัปดาห์ก่อนหน้า</div>
  <div class="cg">${charts}</div>`;
  app.querySelectorAll('.mc,[data-m]').forEach(b=>b.onclick=()=>go(+b.dataset.m,null));
  document.getElementById('stdb').onclick=()=>go(null,null,true);
  document.getElementById('cy').onchange=e=>{V.y=+e.target.value;render()};app.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{SW=b.dataset.sk;render()});
  app.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{MODE=b.dataset.md;render()});
  app.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{CM=+b.dataset.cm;render()});
  document.getElementById('py').onclick=()=>{V.y--;render()};document.getElementById('ny').onclick=()=>{V.y++;render()};
}
function month(){
  wk.textContent=TH[V.m-1].toUpperCase()+' '+V.y;
  app.innerHTML=`<div class="crumb"><a id="bk">‹ ทุกเดือน</a><span>/</span><span>${TH[V.m-1]} ${V.y}</span></div><div class="wg">`+
  [1,2,3,4].map(w=>{const sv=S.weeks[key(V.y,V.m,w)];
    return `<button class="wc${V.y===NY&&V.m===NM&&w===NW?' now':''}" data-w="${w}"><div class="mn">WEEK</div><div class="wt">Week ${w}</div>${sv?`<span class="badge ok">✓ SAVED</span><div class="sub">โดย ${sv.name.replace(/</g,'&lt;')}<br>${fmtD(sv.at)}</div>`:`<span class="badge no">ยังไม่ได้กรอก</span><div class="sub">กดเพื่อกรอกข้อมูล</div>`}</button>`}).join('')+'</div>';
  document.getElementById('bk').onclick=()=>go(null,null);
  app.querySelectorAll('.wc').forEach(b=>b.onclick=()=>go(V.m,+b.dataset.w));
}
function editor(){
  const k=V.std?'STD':key(V.y,V.m,V.w),sv=V.std?S.std:S.weeks[k],P0=V.std?null:prevOf(k),d=draft.data;
  wk.textContent=V.std?'STANDARD MASTER':`${String(V.m).padStart(2,'0')} WEEK ${V.w}`;
  const chips=['ALL',...L.map(l=>l.id)].map(x=>`<button class="chip${x===sel?' on':''}" data-l="${x}">${x==='ALL'?'ทั้งหมด':x}</button>`).join('');
  const panels=L.filter(l=>sel==='ALL'||l.id===sel).map(l=>{
    const D=d[l.id]||(d[l.id]={v:[...l.v],s:[...l.s]}),P=P0&&P0.data[l.id];let n=0;
    const groups=l.g.map(([name,guns],gi)=>`<div class="grp"><div class="gt g${gi}"><span>${name}</span></div><div class="grid">`+guns.map(g=>{
      const side=g%2?'RH':'LH',md=l.m?(isC(l,g)?'cur':'pwr'):'',cv=P&&+P.v[n]!==+D.v[n],cs=P&&+P.s[n]!==+D.s[n];
      const fld=(kk,lab,max,ch)=>{const df=ch?D[kk][n]-P[kk][n]:0,dl=ch?`<em>${(df>0?'+':'')+f2(df)}</em>`:'';
        return `<div class="f ${kk}"><div class="fl"><span>${lab}</span>${dl}</div><input type="number" step="0.01" inputmode="decimal" data-l="${l.id}" data-k="${kk}" data-n="${n}" value="${f2(D[kk][n])}"><div class="bar"><i style="width:${Math.min(100,D[kk][n]/max*100)}%"></i></div></div>`};
      const t=`<div class="tile ${side} ${md}${cv||cs?' chg':''}"><div class="th"><span class="gn">GUN ${String(g).padStart(2,'0')}</span><span class="sd">${side}</span></div>${fld('v',l.m?(md==='cur'?'CURR (KA)':'POWER (KW)'):'VOLT',6,cv)}${fld('s','UP SLOPE ms',40,cs)}</div>`;
      n++;return t}).join('')+'</div></div>').join('');
    return `<div class="panel"><div class="ph"><h2>${l.id}</h2>${l.all?'<span><b style="color:var(--v)">●</b> CURR (KA) ทุก Gun</span>':l.m?'<span><b style="color:var(--v)">●</b> CURR (KA) 1,2,5,6 &nbsp; <b style="color:var(--s)">●</b> POWER (KW)</span>':'<span>'+D.v.length+' GUNS</span>'}</div>${groups}</div>`}).join('');
  app.innerHTML=(V.std?`<div class="crumb"><a id="b1">‹ หน้าแรก</a><span>/</span><span>Standard Master Welding</span></div><div class="note" style="margin-bottom:10px">ลงค่า Standard (ค่ากลาง) ของแต่ละ Gun ในหัว A / B · ค่านี้จะแสดงเป็นเส้นประอ้างอิงในกราฟหน้าแรก</div>`:`<div class="crumb"><a id="b1">‹ ทุกเดือน</a><span>/</span><a id="b2">${TH[V.m-1]}</a><span>/</span><span>Week ${V.w}</span></div>`)+`
  <div class="sv"><div><label>ชื่อผู้บันทึก (จำเป็น) *</label><input class="i" id="nm" maxlength="60" placeholder="ใส่ชื่อผู้กรอกข้อมูล" value="${draft.name.replace(/"/g,'&quot;')}"></div>
  <button class="b p" id="save">💾 Save</button><span class="st" id="st">${toast}</span>
  <div class="note" style="flex-basis:100%">${sv?`บันทึกล่าสุดโดย ${sv.name.replace(/</g,'&lt;')} · ${fmtD(sv.at)}`:(V.std?'ยังไม่เคยบันทึก Standard (ตอนนี้ใช้ค่าเริ่มต้น)':'ยังไม่เคยบันทึกสัปดาห์นี้')}${dirty?' · <span class="warn">● มีการแก้ไขที่ยังไม่ได้ Save</span>':''}<span class="warn" id="wn"></span></div></div>
  <div class="row">${chips}</div>${panels}`;
  const nm=document.getElementById('nm'),sb=document.getElementById('save'),wn=document.getElementById('wn');
  const chk=()=>{const ok=nm.value.trim().length>0;sb.disabled=!ok;wn.textContent=ok?'':' · ต้องใส่ชื่อผู้บันทึกก่อนจึงจะ Save ได้'};
  chk();
  nm.oninput=()=>{draft.name=nm.value;dirty=true;chk()};
  sb.onclick=async()=>{const n=nm.value.trim();if(!n){chk();return}
    {const rec={name:n,at:new Date().toISOString(),data:cp(draft.data)};if(V.std)S.std=rec;else S.weeks[k]=rec}
    persist();const _ok=await pushRemote(V.std?'STD':k,V.std?S.std:S.weeks[k]);if(_ok){dirty=false;draft.name=n;toast='บันทึกแล้ว ✓';render();say('บันทึกแล้ว ✓')}else say('บันทึกขึ้นเซิร์ฟเวอร์ไม่สำเร็จ (เก็บในเครื่องไว้แล้ว ลองกด Save ใหม่)')};
  document.getElementById('b1').onclick=()=>go(null,null);const b2=document.getElementById('b2');if(b2)b2.onclick=()=>go(V.m,null);
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{sel=b.dataset.l;toast='';render()});
  app.querySelectorAll('.f input').forEach(inp=>{inp.onfocus=()=>inp.select();
    inp.onchange=()=>{const v=parseFloat(inp.value);d[inp.dataset.l][inp.dataset.k][+inp.dataset.n]=isNaN(v)?0:v;dirty=true;toast='';render()}});
}
render();
loadRemote();
</script>
